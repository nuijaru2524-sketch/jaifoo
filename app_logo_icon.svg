<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F7F4"/>
      <stop offset="60%" stop-color="#E4EFE7"/>
      <stop offset="100%" stop-color="#C8DEC9"/>
    </linearGradient>

    <!-- Gold Gradient for Coin & Crown -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3BF"/>
      <stop offset="45%" stop-color="#FDCB6E"/>
      <stop offset="100%" stop-color="#E17055"/>
    </linearGradient>

    <!-- Warm Orange Bag Gradient -->
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA7"/>
      <stop offset="50%" stop-color="#FFB871"/>
      <stop offset="100%" stop-color="#FF7675"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="cuteShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#477C67" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Squircle App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle Inner Border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.8"/>

  <!-- Golden Sparkles Background -->
  <g fill="#F1C40F" opacity="0.9">
    <path d="M96 150 L102 135 L108 150 L123 156 L108 162 L102 177 L96 162 L81 156 Z"/>
    <path d="M410 130 L414 118 L418 130 L430 134 L418 138 L414 150 L410 138 L398 134 Z"/>
    <path d="M420 360 L425 345 L430 360 L445 365 L430 370 L425 385 L420 370 L405 365 Z"/>
    <circle cx="100" cy="330" r="6" fill="#FFB871"/>
    <circle cx="430" cy="230" r="5" fill="#74B49B"/>
  </g>

  <!-- Floating Green Banknote Top Left -->
  <g transform="rotate(-18 80 180)">
    <rect x="50" y="160" width="60" height="34" rx="8" fill="#A7D7C5" stroke="#477C67" stroke-width="4"/>
    <circle cx="80" cy="177" r="6" fill="#5C9C82"/>
  </g>

  <!-- Floating Gold Coin Top Right -->
  <g transform="rotate(15 410 190)">
    <circle cx="410" cy="190" r="26" fill="url(#goldGrad)" stroke="#D35400" stroke-width="5"/>
    <text x="410" y="200" font-size="26" font-weight="900" fill="#B33939" text-anchor="middle" font-family="'Prompt', sans-serif">฿</text>
  </g>

  <!-- Mascot Body Shadow -->
  <ellipse cx="256" cy="450" rx="150" ry="24" fill="#74B49B" fill-opacity="0.28"/>

  <!-- Mascot Group with Shadow -->
  <g filter="url(#cuteShadow)">
    
    <!-- Sprout on Head -->
    <g id="sproutGroup">
      <path d="M256 128 C256 70, 200 45, 185 60 C170 75, 200 120, 245 125" fill="#74B49B" stroke="#477C67" stroke-width="9" stroke-linejoin="round"/>
      <path d="M256 128 C256 65, 305 35, 325 52 C345 70, 310 120, 265 125" fill="#A7D7C5" stroke="#477C67" stroke-width="9" stroke-linejoin="round"/>
      <path d="M256 135 L256 110" stroke="#477C67" stroke-width="10" stroke-linecap="round"/>
      
      <!-- Mini Golden Crown -->
      <path d="M225 60 L235 78 L256 50 L277 78 L287 60 L283 88 L229 88 Z" fill="url(#goldGrad)" stroke="#B33939" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="225" cy="58" r="3.5" fill="#E74C3C"/>
      <circle cx="256" cy="48" r="4" fill="#E74C3C"/>
      <circle cx="287" cy="58" r="3.5" fill="#E74C3C"/>
    </g>

    <!-- Chubby White Character Body -->
    <path d="M256 120 C370 120 410 195 410 295 C410 395 355 440 256 440 C157 440 102 395 102 295 C102 195 142 120 256 120 Z" fill="#FFFDF7" stroke="#E6D3B8" stroke-width="11"/>

    <!-- Cute Blush Cheeks -->
    <ellipse cx="165" cy="285" rx="26" ry="17" fill="#FF7675" fill-opacity="0.6"/>
    <ellipse cx="347" cy="285" rx="26" ry="17" fill="#FF7675" fill-opacity="0.6"/>

    <!-- Big Sparkly Eyes -->
    <g>
      <!-- Left Eye -->
      <circle cx="195" cy="260" r="14" fill="#3E342D"/>
      <circle cx="190" cy="254" r="5.5" fill="#FFFFFF"/>
      <circle cx="200" cy="264" r="2.8" fill="#FFFFFF"/>
      <!-- Right Eye -->
      <circle cx="317" cy="260" r="14" fill="#3E342D"/>
      <circle cx="312" cy="254" r="5.5" fill="#FFFFFF"/>
      <circle cx="322" cy="264" r="2.8" fill="#FFFFFF"/>
    </g>

    <!-- Joyful Smile -->
    <path d="M240 285 Q256 305 272 285" stroke="#3E342D" stroke-width="8" stroke-linecap="round" fill="none"/>

    <!-- Giant Money Bag of Wealth (ถุงทองมั่งคั่ง) -->
    <g>
      <!-- Golden Bag Body -->
      <ellipse cx="275" cy="370" rx="86" ry="64" fill="url(#goldGrad)" stroke="#D35400" stroke-width="7"/>
      <!-- Bag neck & Red ribbon cord -->
      <path d="M250 312 C262 320 288 320 300 312 L310 296 L240 296 Z" fill="#F39C12" stroke="#D35400" stroke-width="6"/>
      <ellipse cx="275" cy="315" rx="28" ry="9" fill="#E74C3C"/>
      <path d="M268 320 Q258 338 250 348" stroke="#C0392B" stroke-width="7" stroke-linecap="round"/>
      <path d="M282 320 Q292 338 300 348" stroke="#C0392B" stroke-width="7" stroke-linecap="round"/>
      <!-- Coin symbol on Bag (฿) -->
      <circle cx="275" cy="372" r="32" fill="#FFF9E6" stroke="#D35400" stroke-width="5"/>
      <text x="275" y="388" font-size="38" font-weight="bold" fill="#D35400" text-anchor="middle" font-family="'Prompt', sans-serif">฿</text>
    </g>

    <!-- Soft Chubby Arms Hugging the Bag -->
    <ellipse cx="160" cy="345" rx="26" ry="40" transform="rotate(-38 160 345)" fill="#FFF9E8" stroke="#E6D3B8" stroke-width="8"/>
    <ellipse cx="375" cy="350" rx="24" ry="34" transform="rotate(25 375 350)" fill="#FFF9E8" stroke="#E6D3B8" stroke-width="8"/>
  </g>
</svg>